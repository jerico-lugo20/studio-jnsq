[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Server-rendered journal index needs the blog.html template in its bundle
[functions."render-journal-index"]
  included_files = ["blog.html"]

# blog-ai-fill calls Claude Sonnet 4.5 which can take 15-30s.
# Bump timeout so it doesn't 504 (Netlify's default is 10s; Pro allows up to 26s).
[functions."blog-ai-fill"]
  timeout = 26

# Scheduled publisher: every 30 min, flip any 'scheduled' post whose 8AM UK drop time has arrived.
[functions."scheduled-publisher"]
  schedule = "*/30 * * * *"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ============================================================
# Redirect order matters — Netlify uses FIRST MATCH wins.
# Put query-conditional + most-specific rules BEFORE catch-alls.
# ============================================================

# Dynamic sitemap (auto-includes all published journal posts)
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap-gen"
  status = 200
  force = true

# ------------------------------------------------------------
# /blog -> /journal migration (Journal is now the canonical namespace).
# All /blog and /blog/* URLs 301 to their /journal counterpart.
# ------------------------------------------------------------
[[redirects]]
  from = "/blog"
  to = "/journal"
  status = 301
  force = true

[[redirects]]
  from = "/blog/*"
  to = "/journal/:splat"
  status = 301
  force = true

# Legacy query-param blog URLs -> journal clean paths (301 permanent)
[[redirects]]
  from = "/journal"
  to = "/journal/:post"
  status = 301
  force = true
  query = {post = ":post"}

# Tag filter URLs preserve the journal index (server-rendered)
[[redirects]]
  from = "/journal"
  to = "/.netlify/functions/render-journal-index"
  status = 200
  query = {tag = ":tag"}

# Retire the /journal-mock preview — redirect to the live Journal (301 permanent)
[[redirects]]
  from = "/journal-mock"
  to = "/journal"
  status = 301
  force = true

[[redirects]]
  from = "/journal-mock/*"
  to = "/journal/:splat"
  status = 301
  force = true

# Legacy per-post redirects — old slugs to new canonical slugs (301 permanent)
[[redirects]]
  from = "/journal/bip-15-why-your-marketing-is-working"
  to = "/journal/why-is-your-marketing-working-but-your-brand-equity-isnt"
  status = 301
  force = true

