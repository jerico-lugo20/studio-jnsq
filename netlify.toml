  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/app"
  status = 302
  force = true
  [redirects.query]
  openDiagnostic = ":d"

[[redirects]]
  from = "/"
  to = "/app"
  status = 302
  force = true
  [redirects.query]
  retrieve = ":r"

[[redirects]]
  from = "/portal"
  to = "/app#/strategist"
  status = 302

# Strategist Portal — restore /strategist URL access (JS overlay opens on load)
