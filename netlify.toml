[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"

[[redirects]]
  from = "/diagnostic"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/diagnostic/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/strategist"
  to = "/index.html"
  status = 200
