# Journal post clean URLs: static .html wins when present; otherwise the server-side
# renderer function builds the canonical BIP template with the post's data from the
# blog-crud blob store. This guarantees every dynamically-published post renders
# the EXACT approved canonical layout — no SPA, no CSS leak, no hydration race.
[[redirects]]
  from = "/journal/:slug"
  to = "/.netlify/functions/render-blog-post?slug=:slug"
  status = 200

# Journal index is server-rendered so crawlers see real article links.
# The function falls back to serving blog.html verbatim on any error.
[[redirects]]
  from = "/journal"
  to = "/.netlify/functions/render-journal-index"
  status = 200

