<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" text-anchor="middle" letter-spacing="4" text-transform="uppercase">THE REVENUE PLATEAU</text>

  <!-- Visual: Revenue plateau with growth trajectory -->
  <g>
    <!-- Grid lines for context -->
    <line x1="180" y1="150" x2="180" y2="450" stroke="#E8917A" stroke-width="1" opacity="0.3"/>
    <line x1="1020" y1="150" x2="1020" y2="450" stroke="#E8917A" stroke-width="1" opacity="0.3"/>
    <line x1="180" y1="450" x2="1020" y2="450" stroke="#E8917A" stroke-width="1" opacity="0.3"/>

    <!-- Actual growth line: rises then plateaus -->
    <polyline points="180,420 350,350 520,280 690,240 860,240 1020,240" fill="none" stroke="#6D8397" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Expected growth trajectory (dotted) -->
    <polyline points="690,240 860,180 1020,120" fill="none" stroke="#FDD500" stroke-width="2" stroke-dasharray="5,5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Inflection point marker -->
    <circle cx="690" cy="240" r="8" fill="#FDD500"/>
    <circle cx="690" cy="240" r="4" fill="#394550"/>
  </g>

  <!-- One-liner text -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5" text-anchor="middle">More marketing won't fix a brand problem.</text>

  <!-- Brand mark: yellow dot + text -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
