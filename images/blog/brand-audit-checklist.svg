<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" text-anchor="middle" letter-spacing="4" text-transform="uppercase">THE BRAND AUDIT</text>

  <!-- Visual: 5 horizontal bars at different fill levels with labels -->
  <g>
    <!-- Bar 1: Demand — 100% filled (yellow) -->
    <text x="235" y="186" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#394550" text-anchor="end">Demand</text>
    <rect x="250" y="160" width="700" height="40" fill="none" stroke="#98A7B5" stroke-width="2" rx="20"/>
    <rect x="250" y="160" width="700" height="40" fill="#FDD500" rx="20"/>

    <!-- Bar 2: Credibility — 70% filled (coral) -->
    <text x="235" y="256" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#394550" text-anchor="end">Credibility</text>
    <rect x="250" y="230" width="700" height="40" fill="none" stroke="#98A7B5" stroke-width="2" rx="20"/>
    <rect x="250" y="230" width="490" height="40" fill="#E8917A" rx="20"/>

    <!-- Bar 3: Visibility — 50% filled (steel) -->
    <text x="235" y="326" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#394550" text-anchor="end">Visibility</text>
    <rect x="250" y="300" width="700" height="40" fill="none" stroke="#98A7B5" stroke-width="2" rx="20"/>
    <rect x="250" y="300" width="350" height="40" fill="#6D8397" rx="20"/>

    <!-- Bar 4: Branding — 30% filled (mid-blue) -->
    <text x="235" y="396" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#394550" text-anchor="end">Branding</text>
    <rect x="250" y="370" width="700" height="40" fill="none" stroke="#98A7B5" stroke-width="2" rx="20"/>
    <rect x="250" y="370" width="210" height="40" fill="#98A7B5" rx="20"/>

    <!-- Bar 5: Market Trust — Empty (outline only) -->
    <text x="235" y="466" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#394550" text-anchor="end">Market Trust</text>
    <rect x="250" y="440" width="700" height="40" fill="none" stroke="#98A7B5" stroke-width="2" rx="20"/>
  </g>

  <!-- One-liner text -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5" text-anchor="middle">You can't fix what you haven't measured.</text>

  <!-- Brand mark: yellow dot + text -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
