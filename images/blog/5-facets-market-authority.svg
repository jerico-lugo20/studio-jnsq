<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FDD500" letter-spacing="4">THE 4 FACETS AND THE CENTER</text>

  <!-- Diamond outline -->
  <polygon points="600,150 820,310 600,470 380,310" fill="none" stroke="#FDD500" stroke-width="2" opacity="0.4"/>

  <!-- Faint internal cross -->
  <line x1="600" y1="150" x2="600" y2="470" stroke="#e8e2d3" stroke-width="1"/>
  <line x1="380" y1="310" x2="820" y2="310" stroke="#e8e2d3" stroke-width="1"/>

  <!-- Center: Branding -->
  <circle cx="600" cy="310" r="28" fill="#FDD500" opacity="0.8"/>
  <text x="600" y="315" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#394550">Branding</text>

  <!-- TOP: Demand -->
  <circle cx="600" cy="155" r="6" fill="#394550" opacity="0.5"/>
  <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#394550">Demand</text>

  <!-- RIGHT: Visibility -->
  <circle cx="815" cy="310" r="6" fill="#394550" opacity="0.5"/>
  <text x="845" y="315" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="start" fill="#394550">Visibility</text>

  <!-- BOTTOM: Market Trust -->
  <circle cx="600" cy="465" r="6" fill="#394550" opacity="0.5"/>
  <text x="600" y="495" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#394550">Market Trust</text>

  <!-- LEFT: Credibility -->
  <circle cx="385" cy="310" r="6" fill="#394550" opacity="0.5"/>
  <text x="355" y="315" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="end" fill="#394550">Credibility</text>

  <!-- One-liner -->
  <text x="600" y="555" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#98A7B5">Four facets. One centering point. One diamond.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
