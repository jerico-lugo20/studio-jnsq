<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #FDD500; text-anchor: middle; letter-spacing: 4; }
      .oneliner-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 500; fill: #98A7B5; text-anchor: middle; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #394550; text-anchor: middle; }
      .brand-mark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #394550; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" class="title-text">THE CAC EQUATION</text>

  <!-- LEFT: High CAC (without equity) -->
  <g transform="translate(320, 315)">
    <rect x="-50" y="-90" width="100" height="180" fill="#E8917A" opacity="0.7" rx="4"/>
    <text x="0" y="120" class="label-text">Without Equity</text>
    <text x="0" y="-55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="700" fill="#394550" text-anchor="middle">$450</text>
  </g>

  <!-- CENTER: Down arrow -->
  <g transform="translate(600, 315)">
    <path d="M 0 -50 L 0 50" fill="none" stroke="#FDD500" stroke-width="3.5" stroke-linecap="round"/>
    <polygon points="0,50 -12,30 12,30" fill="#FDD500"/>
  </g>

  <!-- RIGHT: Low CAC (with equity) -->
  <g transform="translate(880, 315)">
    <rect x="-50" y="-55" width="100" height="110" fill="#FDD500" rx="4"/>
    <text x="0" y="80" class="label-text">With Equity</text>
    <text x="0" y="-20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13px" font-weight="700" fill="#fff" text-anchor="middle">$200</text>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" class="oneliner-text">Strong brands pay less to grow.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
