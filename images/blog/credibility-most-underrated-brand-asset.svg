<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FDD500" letter-spacing="4">THE UNDERRATED FACET</text>

  <!-- Visual: 5 bars, credibility highlighted in yellow and larger -->
  <g>
    <!-- Bar 1: Demand (muted) -->
    <rect x="180" y="330" width="60" height="90" fill="#E8917A" opacity="0.4"/>
    <text x="210" y="435" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle" fill="#394550" opacity="0.6">Demand</text>

    <!-- Bar 2: Credibility (BRIGHT YELLOW, LARGER) -->
    <rect x="350" y="280" width="80" height="140" fill="#FDD500"/>
    <text x="390" y="435" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Credibility</text>

    <!-- Bar 3: Visibility (muted) -->
    <rect x="520" y="330" width="60" height="90" fill="#E8917A" opacity="0.4"/>
    <text x="550" y="435" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle" fill="#394550" opacity="0.6">Visibility</text>

    <!-- Bar 4: Branding (muted) -->
    <rect x="690" y="330" width="60" height="90" fill="#E8917A" opacity="0.4"/>
    <text x="720" y="435" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle" fill="#394550" opacity="0.6">Branding</text>

    <!-- Bar 5: Market Trust (muted) -->
    <rect x="860" y="330" width="60" height="90" fill="#E8917A" opacity="0.4"/>
    <text x="890" y="435" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle" fill="#394550" opacity="0.6">Market Trust</text>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#98A7B5">Everyone talks visibility. Credibility does the work.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
