<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FDD500" letter-spacing="4">THREE TERMS. THREE MEANINGS.</text>

  <!-- Visual: Three distinct circles — Brand Equity largest (JNSQ's domain) -->
  <g>
    <!-- Left: Small coral circle "Branding" (surface layer) -->
    <circle cx="250" cy="310" r="45" fill="#E8917A"/>
    <text x="250" y="318" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#fefbef">Branding</text>

    <!-- Center: Large yellow circle "Brand Equity" (financial value — what JNSQ owns) -->
    <circle cx="580" cy="310" r="90" fill="#FDD500"/>
    <text x="580" y="305" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#394550">Brand</text>
    <text x="580" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#394550">Equity</text>

    <!-- Right: Medium outlined circle "Brand Architecture" (portfolio structure) -->
    <circle cx="890" cy="310" r="60" fill="none" stroke="#6D8397" stroke-width="2"/>
    <text x="890" y="305" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Brand</text>
    <text x="890" y="325" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Architecture</text>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#98A7B5">They sound alike. They're not.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
