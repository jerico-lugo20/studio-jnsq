<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" letter-spacing="4">WHEN POSITION MEETS EQUATION</text>

  <!-- Left: MAD™ Diamond -->
  <polygon points="320,190 445,315 320,440 195,315" fill="none" stroke="#FDD500" stroke-width="2" opacity="0.5"/>
  <circle cx="320" cy="315" r="18" fill="#FDD500" opacity="0.7"/>
  <circle cx="320" cy="200" r="4.5" fill="#394550" opacity="0.4"/>
  <circle cx="435" cy="315" r="4.5" fill="#394550" opacity="0.4"/>
  <circle cx="320" cy="430" r="4.5" fill="#394550" opacity="0.4"/>
  <circle cx="205" cy="315" r="4.5" fill="#394550" opacity="0.4"/>

  <text x="320" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#394550">MAD™</text>
  <text x="320" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#98A7B5">Your position</text>

  <!-- Right: RVF™ Three bar groups (simplified, one bar each) -->
  <!-- Early -->
  <rect x="770" y="215" width="36" height="155" rx="18" fill="#e8e2d3" opacity="0.3"/>
  <rect x="770" y="260" width="36" height="110" rx="18" fill="#FDD500" opacity="0.5"/>
  <!-- Scaling -->
  <rect x="820" y="215" width="36" height="155" rx="18" fill="#e8e2d3" opacity="0.3"/>
  <rect x="820" y="240" width="36" height="130" rx="18" fill="#FDD500" opacity="0.65"/>
  <!-- Mature -->
  <rect x="870" y="215" width="36" height="155" rx="18" fill="#e8e2d3" opacity="0.3"/>
  <rect x="870" y="225" width="36" height="145" rx="18" fill="#FDD500" opacity="0.8"/>

  <text x="837" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#394550">RVF™</text>
  <text x="837" y="422" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#98A7B5">Your equation</text>

  <!-- Center: Connection -->
  <line x1="445" y1="315" x2="555" y2="315" stroke="#e8e2d3" stroke-width="1.5"/>
  <line x1="770" y1="315" x2="650" y2="315" stroke="#e8e2d3" stroke-width="1.5"/>

  <!-- Inflection dot with one subtle ring -->
  <circle cx="600" cy="315" r="30" fill="none" stroke="#FDD500" stroke-width="1.5" opacity="0.2"/>
  <circle cx="600" cy="315" r="8" fill="#FDD500" opacity="0.7"/>

  <!-- One-liner -->
  <text x="600" y="530" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5">Your diamond tells you where. Your equation tells you how.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
