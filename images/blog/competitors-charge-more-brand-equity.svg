<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" text-anchor="middle" letter-spacing="4" text-transform="uppercase">SAME PRODUCT. DIFFERENT PRICE.</text>

  <!-- Visual: Two circles with price tags -->
  <g>
    <!-- Left circle: plain, lower price -->
    <circle cx="350" cy="300" r="70" fill="none" stroke="#98A7B5" stroke-width="2"/>
    <circle cx="350" cy="300" r="65" fill="#e8e2d3"/>
    <text x="350" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#394550" text-anchor="middle">Product</text>
    
    <!-- Price tag left -->
    <text x="350" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#6D8397" text-anchor="middle">$99</text>

    <!-- Right circle: with yellow glow, higher price -->
    <!-- Glow effect -->
    <circle cx="850" cy="300" r="85" fill="none" stroke="#FDD500" stroke-width="3" opacity="0.4"/>
    <circle cx="850" cy="300" r="70" fill="none" stroke="#98A7B5" stroke-width="2"/>
    <circle cx="850" cy="300" r="65" fill="#fff9e6"/>
    <text x="850" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#394550" text-anchor="middle">Product</text>
    
    <!-- Price tag right -->
    <text x="850" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="600" fill="#FDD500" text-anchor="middle">$299</text>
  </g>

  <!-- One-liner text -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5" text-anchor="middle">The difference isn't the product. It's the brand.</text>

  <!-- Brand mark: yellow dot + text -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
