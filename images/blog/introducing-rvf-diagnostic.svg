<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FDD500" letter-spacing="4">THE RVF™ DIAGNOSTIC</text>

  <!-- Visual: Three RVF equations with actual terms -->
  <g>
    <!-- Stage labels -->
    <text x="310" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#98A7B5">Early Stage</text>
    <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#98A7B5">Scaling Stage</text>
    <text x="890" y="200" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#98A7B5">Mature Stage</text>

    <!-- Equation 1: Early — Money = Effort + Time (emphasized yellow) -->
    <g>
      <rect x="170" y="240" width="80" height="50" rx="25" fill="#FDD500"/>
      <text x="210" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Money</text>
      <text x="265" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#FDD500">=</text>
      <rect x="285" y="240" width="75" height="50" rx="25" fill="#FDD500" opacity="0.7"/>
      <text x="322" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Effort</text>
      <text x="375" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#FDD500">+</text>
      <rect x="395" y="240" width="70" height="50" rx="25" fill="#FDD500" opacity="0.7"/>
      <text x="430" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Time</text>
    </g>

    <!-- Equation 2: Scaling — Effort = Time + Money (muted coral) -->
    <g opacity="0.5">
      <rect x="480" y="330" width="75" height="50" rx="25" fill="#E8917A"/>
      <text x="517" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Effort</text>
      <text x="570" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#E8917A">=</text>
      <rect x="590" y="330" width="70" height="50" rx="25" fill="#E8917A"/>
      <text x="625" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Time</text>
      <text x="675" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#E8917A">+</text>
      <rect x="695" y="330" width="80" height="50" rx="25" fill="#E8917A"/>
      <text x="735" y="362" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Money</text>
    </g>

    <!-- Equation 3: Mature — Time = Effort + Money (muted steel) -->
    <g opacity="0.5">
      <rect x="755" y="420" width="70" height="50" rx="25" fill="#98A7B5"/>
      <text x="790" y="452" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Time</text>
      <text x="840" y="452" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#98A7B5">=</text>
      <rect x="860" y="420" width="75" height="50" rx="25" fill="#98A7B5"/>
      <text x="897" y="452" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Effort</text>
      <text x="950" y="452" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#98A7B5">+</text>
      <rect x="970" y="420" width="80" height="50" rx="25" fill="#98A7B5"/>
      <text x="1010" y="452" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#394550">Money</text>
    </g>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#98A7B5">Three equations. One clear direction.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
