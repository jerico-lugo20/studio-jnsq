<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" text-anchor="middle" letter-spacing="4" text-transform="uppercase">THE RACE TO THE BOTTOM</text>

  <!-- Visual: Descending pill bars showing downward spiral -->
  <g>
    <!-- Bar 1: Tallest -->
    <rect x="250" y="160" width="650" height="50" fill="#E8917A" rx="25" opacity="0.9"/>

    <!-- Bar 2: Shorter -->
    <rect x="280" y="235" width="590" height="45" fill="#E8917A" rx="22" opacity="0.8"/>

    <!-- Bar 3: Even shorter -->
    <rect x="310" y="305" width="530" height="40" fill="#E8917A" rx="20" opacity="0.7"/>

    <!-- Bar 4: Much shorter -->
    <rect x="340" y="365" width="470" height="35" fill="#E8917A" rx="17" opacity="0.6"/>

    <!-- Bar 5: Very short -->
    <rect x="370" y="420" width="410" height="30" fill="#E8917A" rx="15" opacity="0.5"/>

    <!-- Down arrow at bottom (starts from bottom edge of last bar at y=450) -->
    <polygon points="600,490 612,472 588,472" fill="#E8917A"/>
    <line x1="600" y1="450" x2="600" y2="490" stroke="#E8917A" stroke-width="3"/>
  </g>

  <!-- One-liner text -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5" text-anchor="middle">Price wars have no winners.</text>

  <!-- Brand mark: yellow dot + text -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
