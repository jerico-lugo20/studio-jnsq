<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #FDD500; text-anchor: middle; letter-spacing: 4; }
      .oneliner-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 500; fill: #98A7B5; text-anchor: middle; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #394550; text-anchor: middle; }
      .brand-mark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #394550; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" class="title-text">CUTTING THROUGH PARALYSIS</text>

  <!-- LEFT: Scattered dots (chaos/paralysis) -->
  <g transform="translate(280, 315)">
    <circle cx="-40" cy="-35" r="8" fill="#6D8397" opacity="0.6"/>
    <circle cx="10" cy="-40" r="7" fill="#98A7B5" opacity="0.6"/>
    <circle cx="-25" cy="5" r="9" fill="#6D8397" opacity="0.6"/>
    <circle cx="35" cy="-10" r="6" fill="#98A7B5" opacity="0.6"/>
    <circle cx="15" cy="30" r="8" fill="#6D8397" opacity="0.6"/>
    <circle cx="-35" cy="25" r="7" fill="#E8917A" opacity="0.6"/>
    <circle cx="5" cy="15" r="6" fill="#98A7B5" opacity="0.6"/>
  </g>

  <!-- CENTER: Converging lines -->
  <path d="M 340 240 Q 500 280 620 310" fill="none" stroke="#FDD500" stroke-width="3" stroke-linecap="round"/>
  <path d="M 360 260 Q 500 300 620 310" fill="none" stroke="#FDD500" stroke-width="3" stroke-linecap="round"/>
  <path d="M 340 320 Q 500 315 620 310" fill="none" stroke="#FDD500" stroke-width="3" stroke-linecap="round"/>
  <path d="M 360 360 Q 500 330 620 310" fill="none" stroke="#FDD500" stroke-width="3" stroke-linecap="round"/>

  <!-- RIGHT: Clear focused bar -->
  <rect x="620" y="280" width="160" height="60" fill="#FDD500" rx="8"/>
  <text x="700" y="320" class="label-text" fill="#fff">Clear Path</text>

  <!-- One-liner -->
  <text x="600" y="560" class="oneliner-text">Too many options is not a strategy.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
