<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" letter-spacing="4">THREE STAGES OF BUSINESS GROWTH</text>

  <!--
    Visual concept: three groups showing what shifts across stages.
    Each stage has three rounded bars for Money, Effort, Time.
    The TALLEST bar = what you crave at that stage (yellow).
    The shorter bars = what you trade (coral).
    Bar heights tell the story. Labels just name things.
  -->

  <!-- STAGE 1: EARLY — Money is what you crave -->
  <!-- Money bar (tall, yellow) -->
  <rect x="165" y="140" width="52" height="270" rx="26" fill="#e8e2d3" opacity="0.3"/>
  <rect x="165" y="165" width="52" height="245" rx="26" fill="#FDD500" opacity="0.75"/>
  <!-- Effort bar (medium, coral) -->
  <rect x="230" y="190" width="42" height="220" rx="21" fill="#e8e2d3" opacity="0.3"/>
  <rect x="230" y="230" width="42" height="180" rx="21" fill="#E8917A" opacity="0.4"/>
  <!-- Time bar (medium, coral) -->
  <rect x="284" y="200" width="42" height="210" rx="21" fill="#e8e2d3" opacity="0.3"/>
  <rect x="284" y="250" width="42" height="160" rx="21" fill="#E8917A" opacity="0.4"/>

  <!-- Labels -->
  <text x="245" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#394550">Early</text>
  <text x="245" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#98A7B5">You crave money</text>

  <!-- STAGE 2: SCALING — Effort (leverage) is what you crave -->
  <!-- Money bar (medium, coral) -->
  <rect x="475" y="200" width="42" height="210" rx="21" fill="#e8e2d3" opacity="0.3"/>
  <rect x="475" y="250" width="42" height="160" rx="21" fill="#E8917A" opacity="0.4"/>
  <!-- Effort bar (tall, yellow) -->
  <rect x="530" y="140" width="52" height="270" rx="26" fill="#e8e2d3" opacity="0.3"/>
  <rect x="530" y="175" width="52" height="235" rx="26" fill="#FDD500" opacity="0.75"/>
  <!-- Time bar (medium, coral) -->
  <rect x="595" y="190" width="42" height="220" rx="21" fill="#e8e2d3" opacity="0.3"/>
  <rect x="595" y="240" width="42" height="170" rx="21" fill="#E8917A" opacity="0.4"/>

  <text x="556" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#394550">Scaling</text>
  <text x="556" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#98A7B5">You crave leverage</text>

  <!-- STAGE 3: MATURE — Time is what you crave -->
  <!-- Money bar (medium, coral) -->
  <rect x="790" y="200" width="42" height="210" rx="21" fill="#e8e2d3" opacity="0.3"/>
  <rect x="790" y="245" width="42" height="165" rx="21" fill="#E8917A" opacity="0.4"/>
  <!-- Effort bar (medium, coral) -->
  <rect x="845" y="195" width="42" height="215" rx="21" fill="#e8e2d3" opacity="0.3"/>
  <rect x="845" y="240" width="42" height="170" rx="21" fill="#E8917A" opacity="0.4"/>
  <!-- Time bar (tall, yellow) -->
  <rect x="900" y="140" width="52" height="270" rx="26" fill="#e8e2d3" opacity="0.3"/>
  <rect x="900" y="160" width="52" height="250" rx="26" fill="#FDD500" opacity="0.75"/>

  <text x="878" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#394550">Mature</text>
  <text x="878" y="462" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#98A7B5">You crave freedom</text>

  <!-- Legend -->
  <circle cx="455" cy="520" r="5" fill="#FDD500" opacity="0.75"/>
  <text x="467" y="524" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#98A7B5">What you crave</text>
  <circle cx="590" cy="520" r="5" fill="#E8917A" opacity="0.4"/>
  <text x="602" y="524" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="500" fill="#98A7B5">What you trade</text>

  <!-- One-liner -->
  <text x="600" y="560" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5">Growth changes the equation. Most founders don't.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
