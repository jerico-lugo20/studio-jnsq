<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" text-anchor="middle" letter-spacing="4" text-transform="uppercase">THE REBRANDING TRAP</text>

  <!-- Visual: Hollow circle (new look) vs solid circle (real equity) -->
  <g>
    <!-- LEFT: Shiny hollow exterior (new look) -->
    <!-- Outer circle with coral glow -->
    <circle cx="350" cy="300" r="100" fill="none" stroke="#E8917A" stroke-width="8"/>
    <circle cx="350" cy="300" r="93" fill="none" stroke="#E8917A" stroke-width="1" opacity="0.3"/>
    <!-- Hollow inside -->
    <circle cx="350" cy="300" r="80" fill="#fefbef" opacity="0.5"/>
    <!-- Label -->
    <text x="350" y="450" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#6D8397" text-anchor="middle">New Look</text>

    <!-- RIGHT: Solid filled circle (real equity) -->
    <circle cx="850" cy="300" r="70" fill="#FDD500"/>
    <circle cx="850" cy="300" r="65" fill="#FDD500"/>
    <!-- Label -->
    <text x="850" y="450" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#6D8397" text-anchor="middle">Real Equity</text>

    <!-- vs symbol between them -->
    <text x="600" y="315" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="300" fill="#98A7B5" text-anchor="middle">vs</text>
  </g>

  <!-- One-liner text -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5" text-anchor="middle">A new look without equity is just decoration.</text>

  <!-- Brand mark: yellow dot + text -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
