<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FDD500" letter-spacing="4">THE FORCE BEHIND PRICING</text>

  <!-- Visual: Tall pillar on foundation -->
  <g>
    <!-- Foundation area -->
    <rect x="450" y="380" width="300" height="60" fill="#98A7B5" opacity="0.15"/>
    <line x1="450" y1="380" x2="750" y2="380" stroke="#98A7B5" stroke-width="2" opacity="0.4"/>
    
    <!-- Trust markers on foundation -->
    <text x="480" y="415" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#98A7B5" opacity="0.5">trust</text>
    <text x="600" y="415" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#98A7B5" opacity="0.5">credibility</text>
    <text x="700" y="415" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#98A7B5" opacity="0.5">authority</text>

    <!-- Main yellow pillar -->
    <rect x="525" y="220" width="150" height="160" fill="#FDD500"/>
    
    <!-- Price label at top -->
    <text x="600" y="205" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#394550">PRICE</text>
    <line x1="550" y1="210" x2="650" y2="210" stroke="#394550" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#98A7B5">Trust is the foundation. Price is the result.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
