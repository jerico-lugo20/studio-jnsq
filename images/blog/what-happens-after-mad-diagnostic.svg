<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #FDD500; text-anchor: middle; letter-spacing: 4; }
      .oneliner-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 500; fill: #98A7B5; text-anchor: middle; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #394550; text-anchor: middle; }
      .brand-mark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #394550; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" class="title-text">YOUR PATH AFTER THE DIAGNOSTIC</text>

  <!-- Step 1: Snapshot (outline only) -->
  <g transform="translate(340, 280)">
    <rect x="-60" y="-40" width="120" height="80" fill="none" stroke="#6D8397" stroke-width="2.5" rx="4"/>
    <text x="0" y="-10" class="label-text">Snapshot</text>
    <text x="0" y="15" class="label-text" fill="#98A7B5">Free</text>
  </g>

  <!-- Connection line (400 to 560, reaching Step 2 left edge) -->
  <line x1="400" y1="280" x2="555" y2="280" stroke="#FDD500" stroke-width="2"/>
  <polygon points="560,280 548,275 548,285" fill="#FDD500"/>

  <!-- Step 2: Report (half-filled) -->
  <g transform="translate(620, 280)">
    <rect x="-60" y="-40" width="120" height="80" fill="#FDD500" opacity="0.5" rx="4"/>
    <rect x="-60" y="-40" width="120" height="80" fill="none" stroke="#FDD500" stroke-width="2.5" rx="4"/>
    <text x="0" y="-10" class="label-text">Report</text>
    <text x="0" y="15" class="label-text" fill="#394550">Premium</text>
  </g>

  <!-- Connection line (680 to 800, reaching Step 3 left edge) -->
  <line x1="680" y1="280" x2="795" y2="280" stroke="#FDD500" stroke-width="2"/>
  <polygon points="800,280 788,275 788,285" fill="#FDD500"/>

  <!-- Step 3: Full Diagnostic (solid yellow) -->
  <g transform="translate(860, 280)">
    <rect x="-60" y="-40" width="120" height="80" fill="#FDD500" rx="4"/>
    <text x="0" y="-10" class="label-text" fill="#fff">Full Diagnostic</text>
    <text x="0" y="15" class="label-text" fill="#fff">Complete</text>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" class="oneliner-text">Clarity at every tier.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
