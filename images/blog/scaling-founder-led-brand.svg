<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" text-anchor="middle" letter-spacing="4" text-transform="uppercase">FROM FOUNDER TO SYSTEM</text>

  <!-- Visual: Founder-led to scaled system -->
  <g>
    <!-- LEFT SIDE: Founder with few circles -->
    <!-- Large founder circle -->
    <circle cx="280" cy="300" r="60" fill="#FDD500"/>
    <text x="280" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#394550" text-anchor="middle">You</text>

    <!-- Small connected circles -->
    <circle cx="380" cy="240" r="25" fill="#98A7B5"/>
    <circle cx="410" cy="320" r="25" fill="#98A7B5"/>
    <circle cx="380" cy="400" r="25" fill="#98A7B5"/>

    <!-- Lines connecting -->
    <line x1="330" y1="270" x2="370" y2="245" stroke="#6D8397" stroke-width="2"/>
    <line x1="330" y1="300" x2="390" y2="320" stroke="#6D8397" stroke-width="2"/>
    <line x1="330" y1="330" x2="370" y2="395" stroke="#6D8397" stroke-width="2"/>

    <!-- Arrow -->
    <polygon points="550,300 600,290 600,310" fill="#E8917A"/>
    <line x1="480" y1="300" x2="550" y2="300" stroke="#E8917A" stroke-width="2"/>

    <!-- RIGHT SIDE: System of circles -->
    <!-- Central hub -->
    <circle cx="800" cy="300" r="50" fill="#FDD500"/>
    <text x="800" y="310" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#394550" text-anchor="middle">Brand</text>

    <!-- Grid of connected circles -->
    <circle cx="700" cy="220" r="20" fill="#98A7B5"/>
    <circle cx="760" cy="180" r="20" fill="#98A7B5"/>
    <circle cx="840" cy="170" r="20" fill="#98A7B5"/>
    <circle cx="900" cy="200" r="20" fill="#98A7B5"/>
    <circle cx="920" cy="280" r="20" fill="#98A7B5"/>
    <circle cx="900" cy="360" r="20" fill="#98A7B5"/>
    <circle cx="840" cy="400" r="20" fill="#98A7B5"/>
    <circle cx="760" cy="420" r="20" fill="#98A7B5"/>
    <circle cx="700" cy="380" r="20" fill="#98A7B5"/>
    <circle cx="680" cy="300" r="20" fill="#98A7B5"/>

    <!-- Lines from hub to circles (hub cx=800 cy=300 r=50) -->
    <line x1="765" y1="268" x2="715" y2="232" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="775" y1="255" x2="768" y2="200" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="815" y1="253" x2="835" y2="190" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="843" y1="274" x2="885" y2="215" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="850" y1="296" x2="900" y2="284" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="843" y1="326" x2="885" y2="355" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="815" y1="347" x2="835" y2="385" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="775" y1="345" x2="768" y2="405" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="765" y1="332" x2="715" y2="370" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
    <line x1="750" y1="300" x2="700" y2="300" stroke="#6D8397" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- One-liner text -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5" text-anchor="middle">Scale the brand, not just the person.</text>

  <!-- Brand mark: yellow dot + text -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
