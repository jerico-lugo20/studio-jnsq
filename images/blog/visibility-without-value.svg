<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FDD500" letter-spacing="4">VISIBILITY WITHOUT VALUE</text>

  <!-- Visual: Many faded circles spread out, one with solid yellow center -->
  <g>
    <!-- Scattered faded circles (visibility without value) -->
    <circle cx="250" cy="200" r="35" fill="none" stroke="#E8917A" stroke-width="2" opacity="0.3"/>
    <circle cx="400" cy="150" r="35" fill="none" stroke="#E8917A" stroke-width="2" opacity="0.25"/>
    <circle cx="950" cy="220" r="35" fill="none" stroke="#E8917A" stroke-width="2" opacity="0.3"/>
    <circle cx="800" cy="300" r="35" fill="none" stroke="#E8917A" stroke-width="2" opacity="0.25"/>
    <circle cx="350" cy="380" r="35" fill="none" stroke="#E8917A" stroke-width="2" opacity="0.2"/>
    <circle cx="1050" cy="380" r="35" fill="none" stroke="#E8917A" stroke-width="2" opacity="0.25"/>

    <!-- Center circle with solid yellow (value) -->
    <circle cx="600" cy="300" r="50" fill="none" stroke="#FDD500" stroke-width="3"/>
    <circle cx="600" cy="300" r="35" fill="#FDD500"/>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" text-anchor="middle" fill="#98A7B5">Being seen is not the same as being chosen.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
