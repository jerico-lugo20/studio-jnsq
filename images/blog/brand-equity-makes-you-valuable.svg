<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #FDD500; text-anchor: middle; letter-spacing: 4; }
      .oneliner-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 22px; font-weight: 500; fill: #98A7B5; text-anchor: middle; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; font-weight: 600; fill: #394550; text-anchor: middle; }
      .brand-mark { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #394550; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" class="title-text">PROFITABLE VS VALUABLE</text>

  <!-- LEFT: Smaller circle (Profitable) -->
  <g transform="translate(380, 315)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#E8917A" stroke-width="3"/>
    <circle cx="0" cy="0" r="50" fill="#E8917A" opacity="0.08"/>
    <text x="0" y="8" class="label-text">Profitable</text>
  </g>

  <!-- RIGHT: Larger circle (Valuable, encompassing Profitable) -->
  <g transform="translate(600, 315)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="#FDD500" stroke-width="3"/>
    <circle cx="0" cy="0" r="90" fill="#FDD500" opacity="0.08"/>
    <text x="0" y="8" class="label-text">Valuable</text>
  </g>

  <!-- One-liner -->
  <text x="600" y="560" class="oneliner-text">Others make you profitable. Brand equity makes you valuable.</text>

  <!-- Brand mark -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
