<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fefbef"/>

  <!-- Title -->
  <text x="600" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FDD500" text-anchor="middle" letter-spacing="4" text-transform="uppercase">IDENTITY IS NOT EQUITY</text>

  <!-- Visual: Iceberg concept -->
  <g>
    <!-- Water line -->
    <line x1="200" y1="300" x2="1000" y2="300" stroke="#6D8397" stroke-width="2"/>
    <text x="1050" y="305" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#6D8397">Surface</text>

    <!-- Above water: Identity (small, visible) -->
    <path d="M 400 300 L 500 180 L 600 300 Z" fill="#E8917A" opacity="0.85"/>
    <text x="500" y="245" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Identity</text>
    <text x="500" y="260" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#fff" text-anchor="middle">(Logo, Colors)</text>

    <!-- Below water: Equity (large, hidden) -->
    <path d="M 350 300 L 650 300 L 650 480 L 350 480 Z" fill="#FDD500" opacity="0.75"/>
    <text x="500" y="360" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#394550" text-anchor="middle">Brand Equity</text>
    <text x="500" y="380" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#394550" text-anchor="middle">(Perception, Trust,</text>
    <text x="500" y="398" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#394550" text-anchor="middle">Value, Authority)</text>

    <!-- Depth indicator -->
    <text x="1050" y="390" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#6D8397">Deep</text>
  </g>

  <!-- One-liner text -->
  <text x="600" y="560" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#98A7B5" text-anchor="middle">What you see is the smallest part.</text>

  <!-- Brand mark: yellow dot + text -->
  <circle cx="540" cy="600" r="3" fill="#FDD500"/>
  <text x="600" y="604" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600" fill="#c5bfb0" letter-spacing="2">STUDIO JNSQ</text>
</svg>
